name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: openrag-bench examples/retrieval_results.json --k 2 --output report.json --html report.html
      - name: Paired comparison
        run: |
          openrag-bench examples/comparison_candidate.json --baseline examples/comparison_baseline.json --k 2 --min-delta 0 --output comparison.json --html comparison.html
          python -c "import json; r=json.load(open('comparison.json')); assert r['count']==3 and r['gate']['passed'] and 'paired_bootstrap_95pct_ci' in r"
      - name: TREC run and qrels smoke test
        run: |
          openrag-bench examples/trec_candidate.run --qrels examples/trec.qrels --baseline examples/trec_baseline.run --k 2 --min-delta 0
      - name: SciFact benchmark CLI import smoke test
        run: python examples/scifact_benchmark.py --help
      - name: Dense example CLI import smoke test (no model downloads)
        run: python examples/scifact_dense_faiss.py --help
      - name: Wheel build
        if: matrix.python-version == '3.11'
        run: |
          python -m pip install build
          python -m build --wheel
          python -c "from pathlib import Path; assert len(list(Path('dist').glob('*.whl'))) == 1"
