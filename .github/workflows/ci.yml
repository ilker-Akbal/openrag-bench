name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Enforced development quality gates (Python 3.11)
        if: matrix.python-version == '3.11'
        run: |
          python -m pip install -e '.[dev]'
          python -m ruff check openrag_bench tests
          python -m coverage run --source=openrag_bench -m unittest discover -s tests -v
          python -m coverage report -m --fail-under=90
          python -m coverage xml -o coverage.xml
          python -m unittest discover -s tests -p property_metrics.py -v
      - name: Install package
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: OpenRAG Guard onboarding and doctor smoke test
        run: |
          openrag-bench init --directory guard-demo
          openrag-bench doctor guard-demo/candidate.json --baseline guard-demo/baseline.json --policy guard-demo/guard-policy.json --k 1
          openrag-bench guard guard-demo/candidate.json --baseline guard-demo/baseline.json --policy guard-demo/guard-policy.json --k 1 --html guard_pass.html --output guard_pass.json > /dev/null
          python -c "import json; from pathlib import Path; r=json.load(open('guard_pass.json')); assert r['guard']['passed'] and 'OpenRAG Guard' in Path('guard_pass.html').read_text()"
      - name: A critical-query regression MUST block a macro-improving candidate
        run: |
          set +e
          openrag-bench guard examples/guard_regression.json --baseline examples/guard_baseline.json --policy examples/guard_policy.json --k 1 --output guard_block.json > /dev/null
          exit_code=$?
          set -e
          test "$exit_code" -eq 2
          python -c "import json; r=json.load(open('guard_block.json')); assert r['delta']['ndcg_at_k'] > 0 and not r['guard']['passed'] and 'critical-coverage' in r['guard']['failed_rules']"
      - name: Local OpenRAG Guard composite action test
        if: matrix.python-version == '3.11'
        uses: ./.github/actions/guard
        with:
          candidate: examples/guard_candidate.json
          baseline: examples/guard_baseline.json
          policy: examples/guard_policy.json
          k: '1'
          report: guard-action.json
      - name: Local composite action must block a critical regression
        id: negative_guard_action
        if: matrix.python-version == '3.11'
        continue-on-error: true
        uses: ./.github/actions/guard
        with:
          candidate: examples/guard_regression.json
          baseline: examples/guard_baseline.json
          policy: examples/guard_policy.json
          k: '1'
          report: guard-action-blocked.json
      - name: Confirm critical regression actually failed the composite action
        if: matrix.python-version == '3.11'
        env:
          RESULT: ${{ steps.negative_guard_action.outcome }}
        run: |
          test "$RESULT" = "failure"
          python -c "import json; r=json.load(open('guard-action-blocked.json')); assert not r['guard']['passed']"
      - name: Golden Dataset Studio HTML and JavaScript syntax smoke test
        run: |
          openrag-bench studio --output studio-smoke.html
          python -c "from pathlib import Path; h=Path('studio-smoke.html').read_text(); assert 'connect-src' in h and 'createObjectURL' in h; Path('studio-smoke.js').write_text(h.split('<script>')[1].split('</script>')[0])"
          node --check studio-smoke.js
          node tests/studio_ui_smoke.cjs
          python -c "from openrag_bench.cli import _validate; from openrag_bench.guard import validate_policy; import json; rows=json.load(open('studio-judgments-smoke.json')); _validate(rows,3); assert all(not x['retrieved_ids'] for x in rows); validate_policy(json.load(open('studio-policy-smoke.json')))"
      - name: No-cloud Capture Replay onboarding must block critical regression
        run: |
          python examples/quickstart_capture_replay.py --output-dir reports/onboarding-quickstart > quickstart-summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path("quickstart-summary.json").read_text())
          report = json.loads(Path("reports/onboarding-quickstart/guard.json").read_text())
          assert summary["overall_improved"] and not summary["guard_passed"]
          assert "critical-privacy-hit" in report["guard"]["failed_rules"]
          assert report["delta"]["ndcg_at_k"] > 0
          assert Path("reports/onboarding-quickstart/guard.html").is_file()
          PY
      - name: Luna black-box QA probe (synthetic only)
        run: |
          python scripts/luna_qa_probe.py --output-dir reports/luna-ci > luna-qa-summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("luna-qa-summary.json").read_text())
          assert r["total"] >= 10 and r["passed"] == r["total"], r
          assert Path("reports/luna-ci/studio.html").exists()
          assert Path("reports/luna-ci/blocked.html").exists()
          PY
      - name: CLI smoke test
        run: openrag-bench examples/retrieval_results.json --k 2 --output report.json --html report.html
      - name: Offline explorer smoke test
        run: |
          openrag-bench examples/comparison_candidate.json --baseline examples/comparison_baseline.json --k 2 --html explorer.html > /dev/null
          python -c "from pathlib import Path; h=Path('explorer.html').read_text(); assert 'id=\"query-search\"' in h and 'Top-k overlap' in h and 'No positive labels' in h"
      - name: Offline dashboard explains blocked policy and diverse top-k rankings
        run: |
          openrag-bench guard examples/guard_regression.json --baseline examples/guard_baseline.json --policy examples/guard_policy.json --k 1 --html guard_dashboard.html --output guard_dashboard.json > /dev/null || test "$?" -eq 2
          openrag-bench guard examples/report_diverse_candidate.json --baseline examples/report_diverse_baseline.json --policy examples/guard_policy.json --k 3 --html diverse_dashboard.html > /dev/null
          python -c "from pathlib import Path; a=Path('guard_dashboard.html').read_text(); b=Path('diverse_dashboard.html').read_text(); assert a.index('Release blocked') < a.index('No positive labels'); assert 'Relevant top-k hit lost' in a and 'First relevant rank' in a; assert 'Detailed retrieval metrics' in b and 'Quality checks passed' in b"
      - name: Paired comparison
        run: |
          openrag-bench examples/comparison_candidate.json --baseline examples/comparison_baseline.json --k 2 --min-delta 0 --output comparison.json --html comparison.html
          python -c "import json; r=json.load(open('comparison.json')); assert r['count']==3 and r['gate']['passed'] and 'paired_bootstrap_95pct_ci' in r"
      - name: TREC run and qrels smoke test
        run: |
          openrag-bench examples/trec_candidate.run --qrels examples/trec.qrels --baseline examples/trec_baseline.run --k 2 --min-delta 0
      - name: SciFact benchmark CLI import smoke test
        run: python examples/scifact_benchmark.py --help
      - name: Dense example CLI import smoke test (no model downloads)
        run: python examples/scifact_dense_faiss.py --help
      - name: Framework adapter import smoke test
        run: |
          python -c "from openrag_bench.integrations.frameworks import LangChainAdapter, LlamaIndexAdapter; assert LangChainAdapter and LlamaIndexAdapter"
      - name: Graded qrels plus MAP smoke test
        run: |
          openrag-bench examples/trec_candidate.run --qrels examples/trec_graded.qrels --graded-qrels --k 2 --metric graded_ndcg_at_k > graded.json
          python -c "import json; r=json.load(open('graded.json')); assert 'map_at_k' in r['metrics'] and 'graded_ndcg_at_k' in r['metrics']"
      - name: Streaming JSONL aggregate-only smoke test
        run: |
          openrag-bench examples/retrieval_results.jsonl --streaming-summary --k 2 --output streaming_summary.json > /dev/null
          python -c "import json; r=json.load(open('streaming_summary.json')); assert r['count']==2 and 'per_query' not in r"
      - name: JSONL plus CSV smoke test
        run: |
          openrag-bench examples/retrieval_results.jsonl --k 2 --csv per_query.csv
          python -c "import csv; x=list(csv.DictReader(open('per_query.csv', encoding='utf-8-sig'))); assert len(x)==2"
      - name: Build and audit wheel and source distribution
        if: matrix.python-version == '3.11'
        run: |
          python -m pip install build
          python -m build
          python scripts/audit_distributions.py
      - name: Install sdist in isolated environment
        if: matrix.python-version == '3.11'
        run: |
          python -m venv .sdist-smoke
          .sdist-smoke/bin/pip install dist/*.tar.gz
          .sdist-smoke/bin/openrag-bench examples/retrieval_results.jsonl --k 2 --csv sdist_report.csv > /dev/null
      - name: Install built wheel in isolated environment
        if: matrix.python-version == '3.11'
        run: |
          python -m venv .release-smoke
          .release-smoke/bin/pip install --no-deps dist/*.whl
          .release-smoke/bin/openrag-bench examples/retrieval_results.json --k 2 > /dev/null
