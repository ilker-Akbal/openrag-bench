name: Publish v0.2.0 GitHub pre-release

# Historical v0.2.0 pre-release completed successfully.
# Manual invocation will refuse to overwrite the existing GitHub release.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openrag-bench-v0.2.0
  cancel-in-progress: false

jobs:
  build-and-release:
    if: github.repository == 'ilker-Akbal/openrag-bench' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check version and immutable version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib
          from openrag_bench import __version__
          metadata = tomllib.loads(Path("pyproject.toml").read_text())
          assert metadata["project"]["version"] == __version__ == "0.2.0"
          PY
          if gh release view v0.2.0 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release v0.2.0 already exists: refusing overwrite."
            exit 1
          fi
          if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/v0.2.0" >/dev/null 2>&1; then
            echo "Tag v0.2.0 already exists: refusing overwrite."
            exit 1
          fi
      - name: Run all regression tests and three input format smoke tests
        run: |
          python -m pip install -e .
          python -m unittest discover -s tests -v
          openrag-bench examples/retrieval_results.jsonl --k 2 --csv test.csv --output test.json > /dev/null
          openrag-bench examples/trec_candidate.run --qrels examples/trec_graded.qrels --graded-qrels --k 2 > /dev/null
          python -c "from openrag_bench.integrations.frameworks import LangChainAdapter, LlamaIndexAdapter; assert LangChainAdapter and LlamaIndexAdapter"
      - name: Build and audit source distribution and wheel
        run: |
          python -m pip install build
          python -m build
          python scripts/audit_distributions.py
      - name: Clean install and test wheel
        run: |
          python -m venv .wheel-check
          .wheel-check/bin/pip install --no-deps dist/*.whl
          .wheel-check/bin/openrag-bench examples/retrieval_results.jsonl --k 2 --csv wheel_check.csv > /dev/null
          .wheel-check/bin/python -c "from openrag_bench import __version__; assert __version__ == '0.2.0'"
      - name: Clean install and test source distribution
        run: |
          python -m venv .sdist-check
          .sdist-check/bin/pip install dist/*.tar.gz
          .sdist-check/bin/openrag-bench examples/retrieval_results.json --k 2 > /dev/null
      - name: Record SHA-256 hashes and verify archives
        run: |
          cd dist
          sha256sum openrag_bench-*.whl openrag_bench-*.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
          cat SHA256SUMS
      - name: Create public GitHub v0.2.0 pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.0 \
            dist/openrag_bench-*.whl dist/openrag_bench-*.tar.gz dist/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "OpenRAG Bench v0.2.0" \
            --notes-file docs/RELEASE_NOTES_v0.2.0.md \
            --prerelease
          gh release view v0.2.0 --repo "${GITHUB_REPOSITORY}" --json tagName,isPrerelease,url
