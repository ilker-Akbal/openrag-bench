name: Real RAG framework integration

on:
  pull_request:
    paths:
      - ".github/workflows/framework-real-integration.yml"
      - "examples/framework_real_integration.py"
      - "tests/framework_real_integration.py"
      - "openrag_bench/adapters.py"
      - "openrag_bench/integrations/frameworks.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: "Real ${{ matrix.framework }} (Python 3.11)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        framework: [langchain, llamaindex]
    env:
      OPENRAG_REAL_FRAMEWORK: ${{ matrix.framework }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install core and pinned real framework
        shell: bash
        run: |
          python -m pip install -e .
          if [ "${OPENRAG_REAL_FRAMEWORK}" = "langchain" ]; then
            python -m pip install "langchain-core==1.6.5" "numpy>=1.23,<3"
          else
            python -m pip install "llama-index-core==0.14.25"
          fi
          python -m pip check
      - name: Run real vector retrieval and labeled evaluation
        run: |
          python -m unittest discover -s tests -p framework_real_integration.py -v
          python examples/framework_real_integration.py --framework "${OPENRAG_REAL_FRAMEWORK}" --output framework_result.json
      - name: Verify result and package version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("framework_result.json").read_text())
          assert result["tests_passed"] is True
          assert result["top_1_document_ids"] == ["doc-space", "doc-nature", "doc-sql"]
          assert all(v == 1.0 for v in result["metrics_at_1"].values())
          print(json.dumps(result, indent=2))
          PY
      - name: Upload synthetic aggregate evidence
        uses: actions/upload-artifact@v7
        with:
          name: "real-${{ matrix.framework }}-compatibility"
          path: framework_result.json
          retention-days: 30
